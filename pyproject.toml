[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "alexia-cli"
version = "0.1.0"
description = "CLI client for Alexia Familias (Everest School)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "pydantic>=2.0.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "responses>=0.23.0",
]

[project.scripts]
alexia = "alexia.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["alexia"]
